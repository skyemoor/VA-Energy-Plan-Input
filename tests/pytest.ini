[pytest]
markers =
    slow: marks tests that load real dispatch data and take several seconds (deselect with '-m "not slow"')
    # Registered here so the marker is recognized rather than producing
    # PytestUnknownMarkWarning on every run. This file existed in the project but had never been
    # committed, so a clean checkout warned three times on a passing suite -- noise that trains
    # people to stop reading warnings.
